# C4 model of forge's AGENT fleet — a second diagram alongside the code model
# in c4.toml. Agents are C4 actors (Persons) tagged `agent` so they read apart
# from the human `person`; CLIs are components tagged `cli`. Every edge is
# hand-declared (edges = "declared") — this graph has no import edges.
#
# Nomenclature follows docs/c4-architecture.md — "Element tag vocabulary".
# Render / refresh:  forge-gen-c4 --config agents.c4.toml --format mermaid
system = "Forge Agent Fleet"
description = "The delegation graph of forge's foundation subagents"
output = "docs/agents.dsl"
edges = "declared"
direction = "TB"

# --- Actors: the human + the AI agents (all C4 Persons; tag tells them apart) ---
[[person]]
name = "Developer"
uses = "runs /commit, /pr, /test"
tags = ["person"]

[[person]]
name = "pr-manager"
uses = "orchestrates PR finalization"
tags = ["agent", "mutator"]

[[person]]
name = "design-checker"
tags = ["agent", "reporter"]

[[person]]
name = "security-checker"
tags = ["agent", "reporter"]

[[person]]
name = "docs-types-checker"
tags = ["agent", "mutator"]

[[person]]
name = "precommit-fixer"
tags = ["agent", "mutator"]

[[person]]
name = "git-commit-push"
tags = ["agent", "mutator"]

[[person]]
name = "test-advisor"
tags = ["agent", "reporter"]

[[person]]
name = "test-writer"
tags = ["agent", "mutator"]

# --- The deterministic CLIs the agents drive (the real gate). Modelled as
# externals (not a container) so persons carry no forced person->system edge —
# every rendered edge is a declared delegation/invocation, nothing implicit. ---
[[external]]
name = "forge-precommit"
description = "quality gate"
tags = ["cli"]

[[external]]
name = "forge-pr-squash-comment"
description = "squash-message CLI"
tags = ["cli"]

# --- Delegation + invocation edges (FOUNDATION §3 workflow orders) ---
[[relationship]]
source = "Developer"
destination = "pr-manager"
description = "triggers"

[[relationship]]
source = "pr-manager"
destination = "design-checker"
description = "delegates"

[[relationship]]
source = "pr-manager"
destination = "security-checker"
description = "delegates"

[[relationship]]
source = "pr-manager"
destination = "docs-types-checker"
description = "delegates"

[[relationship]]
source = "pr-manager"
destination = "precommit-fixer"
description = "delegates"

[[relationship]]
source = "precommit-fixer"
destination = "docs-types-checker"
description = "delegates"

[[relationship]]
source = "precommit-fixer"
destination = "design-checker"
description = "delegates"

[[relationship]]
source = "precommit-fixer"
destination = "git-commit-push"
description = "hands off"

[[relationship]]
source = "test-advisor"
destination = "test-writer"
description = "delegates"

[[relationship]]
source = "test-writer"
destination = "test-advisor"
description = "review"

[[relationship]]
source = "precommit-fixer"
destination = "forge-precommit"
description = "invokes"

[[relationship]]
source = "pr-manager"
destination = "forge-pr-squash-comment"
description = "invokes"
