[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tally"
version = "0.1.0"
description = "Count words and lines of plain text files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# forge-scripts is left unpinned: `bench start --forge X.Y.Z` pins the
# release a run measures in the run branch's first commit.
dev = ["forge-scripts", "pytest>=8"]

[project.scripts]
tally = "tally.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.forge]
base_branch = "main"
source_dirs = ["src"]
test_dirs = ["tests"]
