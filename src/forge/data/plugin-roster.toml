# Shipped roster of forge's plugin-provided surface, read by
# verify-forge-agent-doc so consumer agent docs can name plugin skills
# and hooks without the checker calling them dangling (#375 class), and
# by forge-metrics export to tell shipped agent types from local ones.
# Regenerated + drift-checked by tests/test_verify_agent_doc.py against
# skills/*/SKILL.md, claude-hooks/*.sh and agents/*.md — edit those,
# never this file.

