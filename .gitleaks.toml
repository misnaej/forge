# Secret-scan config for the CI gate in .github/workflows/ci.yml.
# gitleaks' native config location, per FOUNDATION §8's config-home rule.
#
# The allowlist is empty, and that is the intended state: forge's own
# secret-shaped test fixtures are built at runtime (`"AKIA" + "A" * 16`),
# so no contiguous literal exists for a scanner to find. Prefer that over
# an entry here.
#
# Before adding one, read the allowlist discipline in
# `forge-docs/ci-recipe.md` — it is the home for those rules, because
# consumers tuning their own config need them. The short version: an entry
# is matched against the secret itself rather than its line, so anchor and
# length-bound it; and a real credential that reaches history is ROTATED,
# never allowlisted.

[extend]
useDefault = true
