# Secret-scan config for the CI gate in .github/workflows/ci.yml.
# gitleaks' native config location, per FOUNDATION §8's config-home rule.
#
# Two rules bind every allowlist entry below, and both are correctness
# rules rather than style:
#
# 1. An allowlist regex is tested against the matched fragment, never the
#    line it sits on, so an entry describes a secret-shaped string and not
#    its context. Anchor and length-bound every one: an unanchored entry
#    silently exempts every longer string that contains it.
# 2. A real credential that reaches history is ROTATED, never allowlisted.
#    An entry here hides it from the scanner and leaves it in the history,
#    which is the opposite of a fix.

[extend]
useDefault = true

[allowlist]
description = "Synthetic fixtures forge's own tests require"
regexes = [
  # tests/test_precommit.py: an AWS-shaped literal the intake-redaction
  # test needs in order to prove a secret-shaped string in a trap file is
  # redacted before it reaches rendered output. Never a live key.
  '''^AKIAABCDEFGHIJKLMNOP$''',
]
