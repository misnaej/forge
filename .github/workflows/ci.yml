# The workflow name is load-bearing: tag-release.yml triggers on
# `workflow_run: workflows: [CI]` — rename both together or tagging
# silently stops firing.
name: CI

# Runs the same checks the local pre-commit hook runs, on every PR + push to
# `main`. Everything is invoked via forge's own CLIs
# (`forge-precommit`, `verify-forge-docstrings`, `forge-doctor`,
# `install-forge-claude-md`) — no bash duplication of what those CLIs already
# do. If the hook passes locally, CI passes here.

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review added to the default trigger set so a draft opened
    # via /pr's escape hatch gets its first CI run when marked ready.
    types: [opened, synchronize, reopened, ready_for_review]

# Defense-in-depth: workflow only reads (no artifact uploads, no PR comments,
# no label mutations). Tagging lives in the separate tag-release.yml
# workflow, keeping every job here read-only by construction.
#
# `pull-requests` and `actions` are read by the tree gate below, which asks
# which PR produced this commit and whether this workflow's own job passed
# on that PR's head. Both are read scopes, so the read-only property above
# still holds. Without them `gh api` fails, the gate reports
# `api unavailable (token/permissions?)` and the suite runs — the safe
# direction, but the optimisation is dead, so that reason string is worth
# watching for in the log.
permissions:
  contents: read
  pull-requests: read
  actions: read

# A push to `main` gets its own group per commit so it is never
# cancelled and never queues: tagging fires on CI success, so a lost run
# is a lost release tag. `refs/heads/main` is spelled out in both halves
# and is coupled to `tag-release.yml`. Why, in full: the "own
# concurrency group" part of `docs/release-process.md` §2.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    # Dependabot PRs bump workflow SHAs and carry no changelog fragment,
    # which the changelog gate demands, so the full sequence can never
    # pass for them. A skipped job satisfies required status checks; the
    # human reviewing the deps PR is the gate.
    # Draft PRs (the /forge-pr skill's early-visibility escape hatch) skip too:
    # verification-first finalization runs the checks locally before
    # publishing, so CI on an unfinished draft is pure waste — the
    # ready_for_review trigger runs it when the draft goes live.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned per docs/security.md "Pin GitHub Actions"; Dependabot
      # (github-actions ecosystem) keeps the pins current.
      - name: Checkout (full history for setuptools-scm)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Secret scan first: a leak must fail before anything else runs, and
      # this step needs no Python. Scope is the commits the PR adds to its
      # base, not full history — a first-adoption scan of everything
      # produces a backlog nobody clears, and the gate then gets switched
      # off; the cost is that pre-adoption history and direct pushes go
      # unscanned (on a push to the base the range is empty). `--redact` is
      # not optional: without it a finding prints the secret into a public
      # log. It masks the matched secret only, so the surrounding line
      # still shows. The binary is pinned by version AND digest because it
      # runs unattended: the version alone does not say which bytes
      # arrive. Keep the pins equal to the shipped recipe's — a test
      # enforces it (`tests/test_ci_recipe_sync.py`).
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: '8.18.4'
          GITLEAKS_SHA256: 'ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d'
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks detect --source . --log-opts="origin/${BASE_REF}..HEAD" \
            --config=.gitleaks.toml --verbose --redact

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install forge-scripts (editable, full dev umbrella)
        # The [dev] umbrella (test + audit + typecheck) mirrors what
        # dev/setup.sh installs locally, so CI's env matches the local
        # pre-commit env — including pyrefly for the enabled typecheck step.
        run: pip install -e ".[dev]"

      # Same sequence the local pre-commit hook runs: ruff lint + ruff
      # format + verify-forge-docstrings (diff vs main) + plugin
      # manifest JSON. Pytest is deliberately NOT in this sequence —
      # it runs as its own step below.
      - name: forge-precommit (pre-commit hook sequence)
        run: forge-precommit

      # On a push to `main` the squash commit's tree is the tree the PR
      # already tested, so its suite has nothing new to learn. The gate
      # decides whether that holds and prints its evidence; rationale and
      # limits live in forge-docs/ci-recipe.md. It must follow the
      # editable install, which provides the CLI.
      #
      # Skipping is only sound for a suite the tree determines, and this
      # one was checked, not assumed: the whole suite was run twice in a
      # scratch snapshot of one tree — same commit, branch renamed
      # between runs — and gave 6188 passed both times. Branch name is
      # the axis with a real incident here (a hook test once read the
      # checkout's branch, so `main` diverged from the PR). Version
      # derivation is stubbed in the tests that touch it. NOT probed:
      # the clock, the commit SHA and tag distance. Nothing enforces any
      # of this, so a test that starts reading `git describe` or the
      # clock would break the assumption silently — `forge-precommit`
      # above still runs unskipped on `main`, and a scheduled full run
      # is the backstop this repo does not yet have.
      #
      # `continue-on-error` is the backstop: the gate is an optimisation,
      # so a bug inside it must cost a redundant test run and never a red
      # `main`. No `verified=true` written means the suite runs.
      - name: forge-tree-verified (has this tree already passed?)
        id: tree_gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: forge-tree-verified --github-output

      # Full suite with the durations sections the slow-tests reporter
      # consumes (flags live in [tool.pytest.ini_options] addopts; the
      # tee follows the documented CI recipe except for where the log
      # goes — see the end of this comment). `shell: bash` is load
      # bearing: an unspecified `run:` step is `bash -e {0}`, with no
      # pipefail, so `pytest | tee` would exit with tee's status and a
      # failing suite would report success. Only the explicit form gets
      # `bash --noprofile --norc -eo pipefail {0}`. The tee'd log is
      # unstamped and never evidence: it only feeds the slow-tests
      # report below, in this job. It goes to the runner's temp dir, not
      # code_health/: forge's own suite fails the session when anything
      # writes the real code_health/ while it runs, and a tee writing
      # there during the run is exactly such a write.
      # Skipped only when the gate proved this exact tree already passed in
      # the PR that landed it. `!= 'true'` rather than `== 'false'` so any
      # unset or malformed output still runs the suite.
      - name: pytest (full suite; skipped when the tree already passed)
        if: steps.tree_gate.outputs.verified != 'true'
        shell: bash
        run: pytest -q | tee "$RUNNER_TEMP/pytest.log"

      # Perf visibility on every run, pass or fail — a slow AND failing
      # suite is when the ranking matters most. Reporter never gates.
      # `always()` so a slow AND failing suite still gets ranked — but the
      # log only exists when pytest ran, so the gate's verdict is part of
      # the condition: a skipped suite would leave this step reading a log
      # never written, comparing nothing and printing a misleading
      # "no timing data" line on a run that has none.
      - name: forge-slow-tests-report (slowest tests + baseline compare)
        if: always() && steps.tree_gate.outputs.verified != 'true'
        run: forge-slow-tests-report --log "$RUNNER_TEMP/pytest.log" --baseline

      # Same drift check the post-merge / post-checkout hooks run locally:
      # the foundation block in CLAUDE.md must match FOUNDATION.md as
      # shipped by the installed forge-scripts.
      - name: install-forge-claude-md --check (CLAUDE.md sync)
        run: install-forge-claude-md --check

  # Builds the distributions the way a consumer's installer does, and
  # installs them into a clean environment. Separate from `ci` because it
  # must not share that job's editable install: an in-place build resolves
  # paths the packaged artifact may not carry, which is exactly how a
  # packaging defect reached a consumer once — every check forge ran was
  # an in-place build, the one mode that cannot fail that way. The sdist
  # leg matters on its own: an installer may materialise a source
  # distribution and build the wheel from that, so both legs run.
  packaging:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for setuptools-scm)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Build sdist and wheel (isolated, as an installer does)
        run: |
          python -m pip install --quiet build
          python -m build --outdir dist/

      - name: Refuse a symlink in the distributions
        # A tracked directory symlink under the package is recorded in the
        # generated source manifest as a file to ship, and the build then
        # aborts trying to copy a directory. Catch it in the artifact
        # rather than in a consumer's half-finished upgrade.
        run: |
          set -euo pipefail
          if tar -tvzf dist/*.tar.gz | grep '^l'; then
            echo "::error::the source distribution contains a symlink"
            exit 1
          fi
          echo "no symlinks in the source distribution"

      - name: Build a wheel from the sdist (the chain an installer takes)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdist" && tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP/sdist"/*/
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/fromsdist"

      - name: Install the wheel into a clean environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet dist/*.whl

      - name: The shipped sources are present and the CLIs run
        # Asserts what the generated integration reads. A wheel that
        # imports but ships no agents would install cleanly and then fail
        # at `install-forge-claude` in the consumer's repo.
        run: |
          set -euo pipefail
          V="$RUNNER_TEMP/venv/bin"
          "$V/python" - <<'PY'
          from importlib import resources
          root = resources.files("forge")
          for rel, suffix, least in (
              ("data/agents", ".md", 10),
              ("data/skills", "", 10),
              ("data/claude-hooks", ".sh", 20),
          ):
              entries = list(root.joinpath(rel).iterdir())
              kept = [e for e in entries if not suffix or e.name.endswith(suffix)]
              assert len(kept) >= least, f"{rel}: only {len(kept)} entries shipped"
              print(f"{rel}: {len(kept)} entries")
          assert root.joinpath("data/hooks.toml").is_file(), "hooks.toml not shipped"
          print("hooks.toml shipped")
          PY
          "$V/forge-doctor" --help > /dev/null
          "$V/install-forge-claude" --help > /dev/null
          echo "CLIs runnable from the installed wheel"
