name: CI

# Runs the same checks the local pre-commit hook runs, on every PR + push to
# `main` or `dev`. Everything is invoked via forge's own CLIs
# (`forge-precommit`, `verify-forge-docstrings`, `forge-doctor`,
# `install-forge-claude-md`) — no bash duplication of what those CLIs already
# do. If the hook passes locally, CI passes here.

on:
  push:
    branches: [main, dev]
  pull_request:

# Defense-in-depth: default is read-only; the one exception is the
# tag-dev-release job below, which carries a job-scoped `contents: write`
# to push the release tag. Pinning least privilege documents intent.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for setuptools-scm)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install forge-scripts (editable, full dev umbrella)
        # The [dev] umbrella (test + audit + typecheck) mirrors what
        # dev/setup.sh installs locally, so CI's env matches the local
        # pre-commit env — including pyrefly for the enabled typecheck step.
        run: pip install -e ".[dev]"

      # Same sequence the local pre-commit hook runs: ruff lint + ruff
      # format + verify-forge-docstrings (diff vs main) + pytest + plugin
      # manifest JSON. No CI-specific bash.
      - name: forge-precommit (pre-commit hook sequence)
        run: forge-precommit

      # Same drift check the post-merge / post-checkout hooks run locally:
      # the foundation block in CLAUDE.md must match FOUNDATION.md as
      # shipped by the installed forge-scripts.
      - name: install-forge-claude-md --check (CLAUDE.md sync)
        run: install-forge-claude-md --check

  tag-dev-release:
    # Tag-on-merge, dual-track flavor: after CI passes on a push to dev,
    # cut the rolling-next tag plugin.json declares (idempotent — no-op
    # when the version equals the latest tag). Gated on the ci job so a
    # broken merge never ships a tag to @dev consumers. Recipe for
    # consumer repos: docs/ci-recipe.md §4.
    #
    # This job holds `contents: write`, so its actions are SHA-pinned and
    # the checkout is pinned to the exact commit the ci job validated
    # (github.sha) — `ref: dev` would re-resolve the tip and could tag a
    # fast-following, unvalidated merge. `--no-sync` keeps forge-next-prep
    # on that pinned SHA instead of syncing back to the branch tip.
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the validated commit (full history + tags)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install forge-scripts
        run: pip install -e .

      - name: Tag the rolling-next release when plugin.json is ahead
        run: forge-next-prep --tag --no-sync --no-prune-branches
