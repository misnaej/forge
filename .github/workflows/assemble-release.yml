name: assemble-release

# Scheduled changelog assembly, the collation half of fragments mode:
# tag-per-merge (tag-release.yml) cuts a tag on every fragment-carrying
# merge; this workflow periodically opens the assembly PR that collates
# the accumulated fragments into CHANGELOG.md and syncs plugin.json
# (`forge-changelog release-pr` — guard, branch, commit, push, PR).
# Merging the PR stays a human decision.
#
# Idempotent: nothing pending or an assembly PR already open → quiet
# no-op (exit 0). The PR body carries in-CLI gate evidence because a
# PR created with the default GITHUB_TOKEN triggers no pull_request CI
# (GitHub anti-recursion): set the FORGE_ASSEMBLY_PAT secret (fine-
# grained PAT, contents + pull-requests write) so CI runs on the PR;
# without it the job still works but warns. Actions are SHA-pinned
# (write-capable workflow). Consumer recipe: forge-docs/ci-recipe.md.

on:
  schedule:
    # DAILY WHILE THIS IS BEING PROVEN. A silently failing scheduled run
    # leaves the manifest frozen — and every tag cut since unreachable to
    # consumers — until someone notices; a weekly cadence turns one such
    # failure into a week of stale plugin distribution, so cadence stays
    # daily until the failure-reporting step below has demonstrably
    # caught one. Once daily runs have demonstrably opened (or quietly
    # no-op'd) for a stretch, drop to Mon/Wed/Fri:
    #   - cron: '0 6 * * 1,3,5'
    - cron: '0 6 * * *'   # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assemble-release
  cancel-in-progress: false

jobs:
  open-assembly-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write      # the failure path below files its own report
    steps:
      - name: Checkout main (full history + tags)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.FORGE_ASSEMBLY_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install forge-scripts
        run: pip install -e .

      - name: Warn when the PAT secret is absent
        env:
          HAS_PAT: ${{ secrets.FORGE_ASSEMBLY_PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::FORGE_ASSEMBLY_PAT is not set — the assembly PR will be created with GITHUB_TOKEN and pull_request CI will NOT run on it (the PR body's in-CLI gate evidence is the only verification)."
          fi

      - name: Open the assembly PR
        env:
          GH_TOKEN: ${{ secrets.FORGE_ASSEMBLY_PAT || github.token }}
        run: |
          # `bash -e` would abort at a failing substitution before the echo,
          # swallowing the guard message that explains the exit code.
          rc=0; out=$(forge-changelog release-pr 2>&1) || rc=$?
          echo "$out"
          echo "$out" >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # A scheduled workflow that fails notifies nobody: GitHub mails only
      # whoever last touched the cron, and nothing appears in the backlog
      # everyone actually reads — so a failure can go unseen indefinitely
      # while the manifest, and therefore every consumer's plugin, stays
      # frozen. The failure now files itself. One open report at a time:
      # a repeat comments on the existing issue rather than opening
      # another.
      - name: Report a failed assembly run
        if: failure()
        env:
          # Deliberately the default token, not the PAT the steps above
          # use: the PAT is scoped to contents + pull-requests, so filing
          # an issue under it would fail and this step would report
          # nothing — the silence it exists to end. `issues: write` on the
          # job grants the default token exactly this.
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'assemble-release: the scheduled assembly run is failing'
        run: |
          set -uo pipefail
          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq \
            "[.[] | select(.title == env.TITLE)] | .[0].number // empty")
          {
            echo "The scheduled assembly run failed: $RUN_URL"
            echo
            echo "While it stays broken, \`.claude-plugin/plugin.json\` does not"
            echo "advance. Claude Code keys its plugin cache on that version, so"
            echo "consumers cannot adopt anything tagged since the last assembly —"
            echo "including any hook or guard fix those tags carried."
            echo
            echo "Check the run's step summary for the assembler's own message."
          } > body.md
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
            echo "Commented on existing report #$existing."
          else
            gh issue create --title "$TITLE" --body-file body.md \
              --label bug --label ci-testing --label needs-triage
          fi
