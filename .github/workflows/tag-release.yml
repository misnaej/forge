name: tag-release

# Tag-on-merge automation, separated from the read-only CI workflow so
# `ci.yml` never carries write permissions. Single-track: one job —
#
# - tag-main: after CI succeeds on a push to main, cut the rolling-next
#   tag `.claude-plugin/plugin.json` declares (idempotent no-op when the
#   version equals the latest tag).
#
# Gating uses `workflow_run` because `needs:` cannot cross workflow
# files: this workflow fires when CI completes, and the job checks the
# run succeeded, was a `push` event (CI also completes for PR runs,
# including forks — those must never reach a write job), and targeted
# main. Checkout pins `workflow_run.head_sha` — the exact commit
# CI validated — never a branch ref that could re-resolve to a newer,
# unvalidated tip. Actions are SHA-pinned (write-capable workflow).
# Consumer recipe: docs/ci-recipe.md §4.

on:
  workflow_run:
    # Must match ci.yml's `name:` exactly — rename both together or
    # this trigger silently stops firing.
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: tag-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  tag-main:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the CI-validated commit (full history + tags)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install forge-scripts
        run: pip install -e .

      - name: Auto-tag newly merged fragments (tag-per-merge)
        run: |
          set +e
          out=$(forge-changelog auto-tag 2>&1); rc=$?
          echo "$out"
          echo "$out" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = "3" ]; then
            echo "::warning::$out"
            rc=0
          fi
          exit $rc

      - name: Tag the rolling-next release when plugin.json is ahead
        run: forge-next-prep --tag --no-sync --no-prune-branches
