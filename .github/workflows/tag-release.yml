name: tag-release

# Tag-on-merge automation, separated from the read-only CI workflow so
# `ci.yml` never carries write permissions. One job —
#
# - tag-main: after CI succeeds on a push to main, `forge-changelog
#   auto-tag` computes the release from the fragments that merge brought
#   (latest tag + their highest bump level) and pushes the tag. The tag
#   is the only place a version lives, so there is nothing for it to
#   agree with and nothing to drift. Idempotent, and it states why
#   whenever it does not tag.
#
# The changelog is assembled separately, by assemble-changelog.yml — a
# tag ships the code, an assembly PR writes the prose for the tags that
# already shipped.
#
# Gating uses `workflow_run` because `needs:` cannot cross workflow
# files: this workflow fires when CI completes, and the job checks the
# run succeeded, was a `push` event (CI also completes for PR runs,
# including forks — those must never reach a write job), and targeted
# main. Checkout pins `workflow_run.head_sha` — the exact commit
# CI validated — never a branch ref that could re-resolve to a newer,
# unvalidated tip. Actions are SHA-pinned (write-capable workflow).
# Consumer recipe: docs/ci-recipe.md §4.

on:
  workflow_run:
    # Must match ci.yml's `name:` exactly — rename both together or
    # this trigger silently stops firing.
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: tag-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  tag-main:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the CI-validated commit (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install forge-scripts
        run: pip install -e .

      - name: Tag the release from the fragments this merge brought
        run: |
          set +e
          out=$(forge-changelog auto-tag 2>&1); rc=$?
          echo "$out"
          echo "$out" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = "3" ]; then
            echo "::warning::$out"
            rc=0
          fi
          exit $rc
