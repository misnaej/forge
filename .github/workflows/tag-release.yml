name: tag-release

# Tag-on-merge automation, separated from the read-only CI workflow so
# `ci.yml` never carries write permissions. Single-track: one job —
#
# - tag-main: after CI succeeds on a push to main, two steps:
#   (1) `forge-changelog auto-tag` — never tags a plugin repo like
#       forge (docs/release-process.md §2); logs the pending-fragment
#       count and the release command. Manifest-less repos copying this
#       job get tag-per-merge here.
#   (2) `forge-next-prep --tag` — cuts forge's release tag: fires on the
#       assembly (release PR) merge, the only commit whose plugin.json
#       is ahead of the latest tag, and logs why on every other merge.
#   Both idempotent; both state why when they do not tag.
#
# Gating uses `workflow_run` because `needs:` cannot cross workflow
# files: this workflow fires when CI completes, and the job checks the
# run succeeded, was a `push` event (CI also completes for PR runs,
# including forks — those must never reach a write job), and targeted
# main. Checkout pins `workflow_run.head_sha` — the exact commit
# CI validated — never a branch ref that could re-resolve to a newer,
# unvalidated tip. Actions are SHA-pinned (write-capable workflow).
# Consumer recipe: docs/ci-recipe.md §4.

on:
  workflow_run:
    # Must match ci.yml's `name:` exactly — rename both together or
    # this trigger silently stops firing.
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: tag-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  tag-main:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the CI-validated commit (full history + tags)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install forge-scripts
        run: pip install -e .

      - name: Auto-tag newly merged fragments (manifest-less repos only)
        run: |
          set +e
          out=$(forge-changelog auto-tag 2>&1); rc=$?
          echo "$out"
          echo "$out" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = "3" ]; then
            echo "::warning::$out"
            rc=0
          fi
          exit $rc

      - name: Tag the release when the assembly merge put plugin.json ahead
        run: forge-next-prep --tag --no-sync --no-prune-branches
